name: Workflow1
on: [push]

# gh runner images
jobs:
  runs-shell-commands:
    runs-on: ubuntu-latest
    steps:
      - name: echo a string
        run: echo "hello world"
      - name: echo a string
        run: | 
          node -v
          npm -v

  parallel-job-macros:
    runs-on: macos-latest
    steps:
      - name: View SW Version
        run: echo "hello world"

  dependent-job:
    runs-on: windows-latest
    needs: runs-shell-commands
    steps:
      - name: echo a string 
        run: write-output "windows string"
      - name: Error Step
        run: something
